<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frio — Cook More, Waste Less</title>
    <link rel="stylesheet" type="text/css" href="./css/style.css" />

    <script>
      /*
      // THIS VERSION USES THE ONCLICK ATTRIBUTE TO FIRE THE HIDE SHOW FUNCTION
      // declare a function with the name toggleShow

      function toggleShow() {
        // grab out menu class ul and store it as a variable in js
        var menu = document.getElementById('menu')
        // log this menu in our console
        console.log(menu)
        // long way first, but it i more flexible when you add more to it
        //does the menu have the class name 'show' in its classList?
        //console.log(menu.classList)
        // if our classList has the class, remove it
        if (menu.classList.contains('show')) {
          menu.classList.remove('show')
        } else {
          //otherwise add the 'show' to the classList

      }

      // to call the function in JS
      // toggleShow()
      */

      // this should begin 90% of the JS code for HTML that you write in this class
      // addEventListener(EventToListenFor, function To Fire When that event happens)
      // document.addEventListener('DOMContentLoaded', function () {
      //   // document
      //   //   .getElementById('mobile-menu')
      //   //   .addEventListener('click', toggleShow)

      //   var hamburger = document.getElementById('mobile-menu')
      //   hamburger.addEventListener('click', toggleShow)
      // })

      function toggleShow() {
        var menu = document.getElementById('menu')
        var hamburger = document.getElementById('mobile-menu')

        menu.classList.toggle('show')

        if (menu.classList.contains('show')) {
            hamburger.innerHTML = '&times;'
        } else {
            hamburger.innerHTML = '&#9776;'
        }
    }

    </script>
  </head>
  <body>
    <header>
      <h1 class="brand"><a href="#">Frio</a></h1>
      <!-- Hide this till we hit smaller screens! -->
      <!-- If you dont use an event listener, you can apply one in the tag itself -->
      <!-- <span class="mobile-menu" onclick="toggleShow()">&#8801;</span> -->
       <span class="mobile-menu" id="mobile-menu" onclick="toggleShow()">&#9776;</span>

      <nav>
        <ul class="menu" id="menu">
          <li><a href="index.html">HOME</a></li>
          <li><a href="recipes.html">RECIPES</a></li>
          <li><a href="fridge.html">MY FRIDGE</a></li>
        </ul>
      </nav>
    </header>

  
    <main>
        <!-- MY FRIDGE PAGE -->
         <section class="fridge-page">
            <h1>My Fridge</h1>
            <p>Keep track of your ingredients and reduce food waste.</p>
            
            <!-- Search Ingredients -->
             <input
             type="text"
             class="fridge-search"
             placeholder="Search ingredients..."
             >


            <div class="fridge-heading">
                <h2>My Ingredients</h2>
                <button class="add-ingredient-btn">+ Add Ingredient</button>
            </div>
            
            <!-- Fridge Filters -->

            <div class="fridge-filters">
                <button class="fridge-filter-btn active">All</button>
                <button class="fridge-filter-btn">Near-expiry</button>
                <button class="fridge-filter-btn">Fresh</button>
                <button class="fridge-filter-btn">Meat</button>
                <button class="fridge-filter-btn">Vegetable</button>
                <button class="fridge-filter-btn">Fruits</button>
                <button class="fridge-filter-btn">Dairy</button>
                <button class="fridge-filter-btn">Others</button>
            </div>


            <div class="ingredient-list">

                <div class="ingredient-card">
                    <span>Milk</span>
                    <span>2 days left</span>
                </div>

                <div class="ingredient-card">
                    <span>Spinach</span>
                    <span>3 days left</span>
                </div>

                <div class="ingredient-card">
                    <span>Chicken</span>
                    <span>4 days left</span>
                </div>

                <div class="ingredient-card">
                    <span>Eggs</span>
                    <span>7 days left</span>
                </div>

            </div>

        </section>

    </main>


  </body>
</html>
